<head>
<meta charset="utf-8">

<title>البوابة للشحن البحري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: the Al-Bawaba documents program shell. A white top bar carries the logo, the tabs and the tools, with the logo's gradient as its lower edge; the work area scrolls under it; on phones the tabs move to a navy bar at the bottom. Day is the default and never follows the system setting; night is chosen from the top bar. */
:root{
  color-scheme:light;
  --bg:#F5F7F9;--surface:#FFFFFF;--surface-2:#EEF1F5;--surface-3:#E3E8EE;
  --ink:#1A2233;--ink-2:#5B6675;--ink-3:#848E9C;--line:#DCE1E8;--line-2:#C7CFD9;
  --brand:#28B88B;--brand-strong:#1E9E76;--brand-ink:#0E6E4E;--brand-soft:#D8F2DF;--lime:#BDF194;--on-brand:#20242D;
  --rail:#20242D;--rail-ink:#A9B4AF;--rail-active:#BDF194;
  --ok:#137A3A;--ok-soft:#E3F4E8;--warn:#A95A0C;--warn-soft:#FDF0DF;--crit:#B83232;--crit-soft:#FBE3E1;--info:#2B6E99;--info-soft:#E0EDF6;
  --toast:#20242D;--toast-ink:#EEF3F0;
  /* container status colours: on the way (the logo's sea turquoise), arrived and needs follow-up (amber), closed (brand green) */
  --st-way:#00ABBD;--st-arr:#F0A83A;--st-done:#28B88B;--st-ink:#20242D;--tint:7%;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.07);
  --shadow-lg:0 10px 40px rgba(16,24,40,.16);
  --backdrop:rgba(16,22,32,.45);
  /* the logo's gradient, starting under the logo (inline-start) */
  --brand-grad:linear-gradient(to left,#00ABBD,#28B88B 55%,#A6CE39);
  --r:10px;
  --font-ar:"IBM Plex Sans Arabic","Montserrat",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-num:"Montserrat","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-mode="night"]{
  color-scheme:dark;
  --bg:#171B22;--surface:#20242D;--surface-2:#282D37;--surface-3:#313741;
  --ink:#E8EDF2;--ink-2:#AAB4C0;--ink-3:#7F8998;--line:#333945;--line-2:#414855;
  --brand-strong:#3CCB9E;--brand-ink:#7EDFBE;--brand-soft:rgba(40,184,139,.17);
  --rail:#12151B;--rail-ink:#8F9AA6;
  --ok:#4FC58C;--ok-soft:rgba(79,197,140,.15);--warn:#E3AA4C;--warn-soft:rgba(227,170,76,.15);--crit:#F28080;--crit-soft:rgba(242,128,128,.15);--info:#6CB4E2;--info-soft:rgba(108,180,226,.15);
  --toast:#2B313C;--tint:13%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.28);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
  --backdrop:rgba(0,0,0,.6);
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate}
.mono,.file{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
.cur{color:var(--ink-2);font-size:.85em}
.muted{color:var(--ink-2)}
.cno{font-family:var(--font-num);font-weight:600;letter-spacing:.03em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cno .cd{border:1.5px solid currentColor;border-radius:3px;padding:0 3px;margin-inline-start:3px}
.empty{color:var(--ink-2);padding:12px 0}

/* shell and top bar */
.shell{flex:1;min-height:0;display:flex;flex-direction:column}
.top{flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:10px;height:61px;padding-bottom:3px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);min-width:0}
.top::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--brand-grad);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.logo{display:block;flex:none;width:37px;height:32px;object-fit:contain;user-select:none;-webkit-user-drag:none}
.brand-name{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-name b{font-size:15px;font-weight:700;white-space:nowrap}
.brand-name span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.topnav{display:flex;align-self:stretch;gap:2px;margin-inline-start:12px;min-width:0}
.topnav button{display:flex;align-items:center;gap:7px;padding-inline:12px;border:0;border-block:2.5px solid transparent;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer;position:relative}
.topnav button:hover{color:var(--ink)}
.topnav button.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--crit);color:#FFFFFF;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;padding-inline:5px;font-family:var(--font-num);line-height:1}
.top-tools{display:flex;align-items:center;gap:6px;margin-inline-start:auto;flex:none}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.sync-pill{display:flex;align-items:center;gap:7px;height:32px;padding-inline:11px;border:0;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--ok-soft);color:var(--ok);white-space:nowrap;cursor:pointer}
.sync-pill.off{background:var(--warn-soft);color:var(--warn)}
.sync-pill .badge{display:none;background:var(--warn)}
.um{position:relative}
.user-chip{display:flex;align-items:center;gap:8px;height:40px;padding-inline:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.user-chip:hover{border-color:var(--line-2)}
.user-chip .ic{color:var(--ink-3)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:start}
.who b{font-size:12.5px;font-weight:600;white-space:nowrap}
.who span{font-size:11px;color:var(--ink-2);white-space:nowrap}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:60;width:min(290px,calc(100vw - 32px));padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg)}
.menu-sec{font-size:11px;font-weight:600;color:var(--ink-2);padding:8px 10px 4px;letter-spacing:.02em}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:start;font-size:13px;color:var(--ink);cursor:pointer}
.menu-item:hover{background:var(--surface-2)}
.menu-item.on{background:var(--brand-soft);color:var(--brand-ink)}
.menu-item .grow{flex:1;min-width:0}
.menu-item small{display:block;font-size:11.5px;color:var(--ink-2)}
.menu-item.on small{color:var(--brand-ink);opacity:.85}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu-note{font-size:11.5px;color:var(--ink-2);padding:9px 10px 4px;border-top:1px solid var(--line);margin-top:4px;line-height:1.6}
.main{flex:1;min-height:0;overflow:auto}
.view{max-width:1320px;margin-inline:auto;padding-top:22px;padding-bottom:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:1240px){.brand-name span{display:none}.sync-pill .txt{display:none}.sync-pill{padding-inline:9px}.sync-pill .badge{display:inline-grid}}
@media (max-width:1100px){.brand-name{display:none}.who{display:none}.topnav button{padding-inline:9px}}
@media (max-width:960px){.topnav button .ic{display:none}.topnav button{padding-inline:8px}}
@media (max-width:700px){
  .top{gap:8px}
  .brand-name{display:flex}
  .top-mode{display:none}
  .topnav{position:fixed;bottom:0;left:0;right:0;margin:0;gap:0;height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:var(--rail);z-index:30}
  .topnav button{flex:1;min-width:0;overflow:hidden;flex-direction:column;justify-content:center;gap:3px;padding-inline:2px;font-size:10.5px;color:var(--rail-ink);border-bottom:0}
  .topnav button .ic{display:block}
  .topnav button.on{color:var(--rail-active);border-top-color:var(--rail-active)}
  .topnav button:hover{color:#E9EFEC}
  .topnav .badge{position:absolute;top:5px;inset-inline-end:calc(50% - 22px);min-width:16px;height:16px;font-size:10px}
  .view{padding-top:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* page */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px}
.title{font-size:22px;font-weight:700}
.sub{color:var(--ink-2);margin-top:4px;font-size:13px;max-width:72ch}
.h2{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-family:var(--font-num);font-size:11px;font-weight:600;min-width:20px;height:20px;padding-inline:6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);display:inline-grid;place-items:center;line-height:1}
.eyebrow{font-size:12px;color:var(--ink-2);font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding-inline:14px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.sm{height:30px;padding-inline:10px;font-size:12.5px;border-radius:8px}
.btn.link{border-color:transparent;background:transparent;color:var(--brand-ink);padding-inline:4px}
.btn.link:hover{text-decoration:underline;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding-inline:12px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input,select,textarea{width:100%;min-width:0;height:38px;padding-inline:11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{height:auto;padding-block:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-2);cursor:not-allowed}
input[type="checkbox"],input[type="radio"]{width:auto;height:auto;padding:0;accent-color:var(--brand);box-shadow:none}
.search{max-width:340px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--brand-soft);color:var(--brand-ink)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl .r{text-align:end;white-space:nowrap}
.q4,.q4h{display:grid;grid-template-columns:repeat(4,46px);gap:2px;text-align:center}
.q4 span{font-family:var(--font-num);font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:5px;padding:1px 0}
.q4 span.lag{background:var(--warn-soft);color:var(--warn);font-weight:600}
.q4h span{font-size:11px}

/* container status colours */
.g-way{--g:var(--st-way)}
.g-arr{--g:var(--st-arr)}
.g-done{--g:var(--st-done)}
.gdot{width:11px;height:11px;border-radius:3px;background:var(--g);flex:none;display:inline-block}
.gchip{display:inline-flex;align-items:center;min-height:22px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--g);color:var(--st-ink);white-space:nowrap}
.gdetail{font-size:12.5px;color:var(--ink-2)}
.cc-band{display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;padding:8px 14px;background:var(--g);color:var(--st-ink);font-size:13px;line-height:1.45}
.cc-band b{font-weight:700}
.cc-band .band-d{font-weight:500}
.cc-band .file{margin-inline-start:auto}

/* home */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer}
.kpi:hover{border-color:var(--line-2)}
.k-label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.k-val{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.k-val .cur{font-size:15px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.alerts{display:flex;flex-direction:column}
.al{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:start;cursor:pointer}
.al:first-child{border-top:0}
.al:hover{background:var(--surface-2)}
.al.crit{--sev:var(--crit);--sev-soft:var(--crit-soft)}
.al.warn{--sev:var(--warn);--sev-soft:var(--warn-soft)}
.al.info{--sev:var(--info);--sev-soft:var(--info-soft)}
.al-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sev-soft);color:var(--sev)}
.al-t{min-width:0;font-size:13px}
.al-t b{display:block;font-size:11.5px;font-weight:700;color:var(--sev)}
.act-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer}
.act-row:first-of-type{border-top:0}
.act-row:hover{background:var(--surface-2)}
.act-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}
.steps i{height:5px;border-radius:3px;background:var(--surface-3)}
.steps i.done{background:var(--g,var(--brand))}

/* containers */
.gsec{margin-top:28px}
.gsec:first-of-type{margin-top:0}
.gsec-h{margin-bottom:12px}
.gsec-h .h2{margin:0}
.gsec-h .sub{margin-top:2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.cc{display:flex;flex-direction:column;min-width:0;border:1px solid color-mix(in srgb,var(--g) 45%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--g) var(--tint),var(--surface));overflow:hidden;cursor:pointer}
.cc:hover{border-color:var(--g);box-shadow:var(--shadow)}
.cc-body{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.cc-line{font-size:13px}
.cap{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.bar{flex:1;min-width:60px;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--g,var(--brand))}
.bar.over>i{background:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:12px;padding:1px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.st{display:flex;gap:6px;flex-wrap:wrap}
.st span{font-size:11.5px;padding:1px 8px;border-radius:6px;border:1px dashed var(--line-2);color:var(--ink-2);font-weight:600;background:var(--surface)}
.st span.ok{background:var(--ok-soft);color:var(--ok);border:1px solid transparent}
.back{margin-bottom:12px}
.c-hero{border:1px solid color-mix(in srgb,var(--g) 45%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--g) var(--tint),var(--surface));overflow:hidden}
.c-head{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:center;padding:16px}
@media (max-width:700px){.c-head{grid-template-columns:minmax(0,1fr)}}
.c-pic{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.c-pic img,.c-pic svg.box{width:100%;max-width:320px;border-radius:10px;display:block;aspect-ratio:320/150;object-fit:cover;background:var(--surface-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:13px;margin-top:6px}
.meta b{color:var(--ink);font-weight:600}
.stage-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.stage-row select{width:auto}
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:16px}
@media (max-width:820px){.states{grid-template-columns:minmax(0,1fr)}}
.state{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.state.ok{background:var(--ok-soft);border-color:transparent}

const fmtDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${+d}/${+m}/${y}`; };

const NF2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const NF4 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 4 });
const n2 = x => NF2.format(r2(x)); const n0 = x => NF0.format(Math.round(x)); const n4 = x => NF4.format(x);

const CURS = { USD: { sym: '$', dec: 2 }, IQD: { sym: 'د.ع', dec: 0 }, CNY: { sym: '¥', dec: 2 } };

function userMenu() {
  const item = (act, v, on, label, small) => `<button class="menu-item ${on ? 'on' : ''}" role="menuitemradio" aria-checked="${on}" data-act="${act}" data-v="${h(v)}"><span class="grow">${label}${small ? `<small>${small}</small>` : ''}</span>${on ? ic('check', 'sm') : ''}</button>`;
  return `<div class="menu" role="menu" aria-label="خيارات العرض">
    <div class="menu-sec">العمل بصفة</div>
    ${item('role', 'manager', isMgr(), 'المدير', 'كل الصلاحيات، ومنها الاعتمادات والتسليم بالآجل')}
    ${item('role', 'employee', !isMgr(), 'موظف الحسابات', 'السندات والحوالات وكشوف الحساب، بلا اعتمادات')}
    <div class="menu-sec">الموقع</div>
    ${item('loc', 'ميسان', S.ui.location === 'ميسان', 'ميسان')}
    ${item('loc', 'مكتب الصين', S.ui.location === 'مكتب الصين', 'مكتب الصين')}
    <hr>
    <button class="menu-item" role="menuitem" data-act="mode">${ic(MODE === 'night' ? 'sun' : 'moon', 'sm')}<span class="grow">${MODE === 'night' ? 'الوضع النهاري' : 'الوضع الليلي'}</span></button>
    <p class="menu-note">خيارات لتجربة الصلاحيات والعمل من موقعين. كل ما يُدخل يُسجَّل باسم الموقع.</p>
  </div>`;
}
function renderTop() {
  const pc = pendingCount(), ac = alerts().filter(a => a.sev !== 'info').length;
  const roleName = isMgr() ? 'المدير' : 'موظف الحسابات';
  const syncTxt = S.ui.online ? 'متصل بالسيرفر' : `بدون إنترنت${pc ? '، ' + pc + ' بانتظار المزامنة' : ''}`;
  const modeTxt = MODE === 'night' ? 'الوضع النهاري' : 'الوضع الليلي';
  $('top').innerHTML = `<div class="brand"><img class="logo" src="${LOGO}" alt="البوابة" width="37" height="32"><div class="brand-name"><b>البوابة للشحن البحري</b><span>نسخة عرض، والبيانات تجريبية</span></div></div>
    <nav class="topnav" aria-label="التبويبات">${TABS.map(([k, label]) => `<button class="${U.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" ${U.tab === k ? 'aria-current="page"' : ''}>${ic(k)}<span>${label}</span>${k === 'home' && ac ? `<span class="badge">${ac}</span>` : ''}</button>`).join('')}</nav>
    <div class="top-tools">
      <button class="sync-pill ${S.ui.online ? '' : 'off'}" data-act="toggleOnline" title="${syncTxt}. اضغط لتجربة العمل بدون إنترنت ثم المزامنة" aria-label="${syncTxt}">${ic(S.ui.online ? 'cloud' : 'cloudoff')}<span class="txt">${syncTxt}</span>${!S.ui.online && pc ? `<span class="badge">${pc}</span>` : ''}</button>
      <button class="icon-btn top-mode" data-act="mode" title="${modeTxt}" aria-label="${modeTxt}">${ic(MODE === 'night' ? 'sun' : 'moon')}</button>
      <div class="um"><button class="user-chip" data-act="menu" aria-haspopup="menu" aria-expanded="${U.menu ? 'true' : 'false'}" aria-label="المستخدم ${roleName}، الموقع ${h(S.ui.location)}"><span class="avatar">${isMgr() ? 'م' : 'ح'}</span><span class="who"><b>${roleName}</b><span>${h(S.ui.location)}</span></span>${ic('chev', 'sm')}</button>${U.menu ? userMenu() : ''}</div>
    </div>`;
}
function render() {
  bust(); U.menu = false; renderTop();
  $('main').innerHTML = `<div class="view">${VIEWS[U.tab]()}</div>`;
  renderModal();
}
function go(tab, extra = {}) { U.tab = tab; Object.assign(U, extra); render(); $('main').scrollTop = 0; }

const VIEWS = {};
VIEWS.home = () => {
  const cs = S.containers.filter(c => !cState(c).closed);
  const cnt = k => S.containers.filter(c => grp(c).k === k).length;
  const owed = sum(S.parties.filter(p => p.type === 'trader'), p => Math.max(0, traderSummary(p.id).total));
  const trOpen = S.transfers.filter(t => t.status !== 'complete').length;
  const A = alerts();
  let wd = ''; try { wd = new Intl.DateTimeFormat('ar', { weekday: 'long' }).format(new Date()); } catch (e) {}
  const kpi = (label, v, tab, extra = '', g = '') => `<button class="kpi${g ? ' g-' + g : ''}" data-act="tab" data-tab="${tab}" ${extra}><span class="k-label">${g ? '<span class="gdot"></span>' : ''}${label}</span><span class="k-val">${v}</span></button>`;
  const SEV_IC = { crit: 'alert', warn: 'clock', info: 'info' };
  const act = cs.slice().sort((a, b) => STAGE_ORDER.indexOf(b.stage) - STAGE_ORDER.indexOf(a.stage)).map(c => {
    const i = STAGE_ORDER.indexOf(c.stage), g = grp(c);

function tradersList() {
  const q = U.pq.trim();
  let list = S.parties.filter(p => p.type === 'trader').map(p => ({ p, s: traderSummary(p.id) }));
  if (q) list = list.filter(x => (x.p.name + ' ' + (x.p.city || '') + ' ' + (x.p.phone || '')).includes(q));
  list.sort((a, b) => b.s.total - a.s.total);
  if (!list.length) return '<p class="empty">لا يوجد تاجر يطابق البحث.</p>';
  return `<div class="trows">${list.map(({ p, s }) => {
    const chips = [];
    Object.entries(s.targets).filter(([k, v]) => k.startsWith('container:') && Math.abs(v) >= 0.01).forEach(([k, v]) => { const c = C(k.split(':')[1]); chips.push(`<button class="tg cont" data-act="target" data-t="${p.id}" data-key="${k}">${c ? c.fileNo : ''} <b>${n2(v)}</b></button>`); });
    Object.entries(s.targets).filter(([k, v]) => k.startsWith('order:') && Math.abs(v) >= 0.01).forEach(([k, v]) => { const o = O(k.split(':')[1]); chips.push(`<button class="tg" data-act="target" data-t="${p.id}" data-key="${k}">بضاعة طلب ${o ? o.no : ''} <b>${n2(v)}</b></button>`); });
    if (s.opening) chips.push(`<span class="tg">رصيد افتتاحي <b>${n2(s.opening)}</b></span>`);
    if (s.unalloc > 0) chips.push(`<span class="tg free">دفعة غير مخصصة <b>−${n2(s.unalloc)}</b></span>`);
    const cls = s.total > 0.004 ? 'owes' : s.total < -0.004 ? 'credit' : '';
    return `<article class="card trow"><div class="t-main"><div class="t-name">${h(p.name)}</div><div class="muted" style="font-size:12.5px">${h(p.city || '')}${p.phone ? ` · <span class="num">${h(p.phone)}</span>` : ''}</div></div>
      <div class="t-bal ${cls}"><div class="k-label">${s.total > 0.004 ? 'عليه' : s.total < -0.004 ? 'له' : 'الرصيد'}</div><div class="t-amt">${usd(Math.abs(s.total))}</div></div>

      <div class="t-act actions"><button class="btn sm" data-act="modal" data-type="receipt" data-t="${p.id}">سند قبض</button><button class="btn sm" data-act="modal" data-type="statement" data-t="${p.id}">كشف حساب</button></div></article>`;
  }).join('')}</div>`;
}

/* ---------- modals ---------- */
const MODALS = {}, LIVE = {}, SAVE = {};
function dlg(title, body, foot, wide) { return `<div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dlg-h"><h2 id="dlg-title">${title}</h2><button class="x" data-act="close" aria-label="إغلاق">×</button></div><div class="dlg-b">${body}<div id="dlg-err" class="errbox" hidden></div></div><div class="dlg-f">${foot}</div></div>`; }
const saveBtns = (label = 'حفظ') => `<button class="btn primary" data-act="save">${label}</button><button class="btn" data-act="close">إلغاء</button>`;
function err(msg) { const e = $('dlg-err'); if (e) { e.textContent = msg; e.hidden = false; } return false; }
function openModal(m) { U.modal = m; renderModal(); }
function closeModal() { U.modal = null; renderModal(); }
function renderModal() {
  const box = $('modal');
  if (!U.modal) { box.innerHTML = ''; box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<div class="ovl" data-ovl="1">${MODALS[U.modal.type](U.modal)}</div>`;
  LIVE[U.modal.type]?.();
  const f = box.querySelector('.dlg-b input:not([type=hidden]):not([disabled]), .dlg-b select, .dlg-b button'); if (f) f.focus({ preventScroll: true });
}
const opts = (list, sel, ph) => (ph ? `<option value="">${ph}</option>` : '') + list.map(([v, l]) => `<option value="${h(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${h(l)}</option>`).join('');

function readLines() {

SAVE.newOrder = () => {
  let tid = val('no-trader-id');
  const isNew = !$('nt-box').hidden;
  if (isNew) { if (!val('nt-name2')) return err('اكتب اسم التاجر الجديد'); }
  else if (!tid) return err('اختر التاجر من الأسماء المقترحة، أو عرّف تاجراً جديداً بعلامة +');
  const lines = readLines().filter(l => l.desc || l.cartons);
  if (!lines.length) return err('أضف صنفاً واحداً على الأقل');
  for (const l of lines) { if (!l.desc) return err('اكتب وصف كل صنف'); if (!(l.cartons > 0)) return err(`عدد الكراتين مطلوب للصنف «${l.desc}»`); if (!(l.cbm > 0)) return err(`حجم الصنف «${l.desc}» مطلوب`); }
  const goods = num('no-goods'); if (!(goods > 0)) return err('اكتب قيمة البضاعة');
  const tpaid = r2(num('no-tpaid')), cpaid = r2(num('no-completed'));
  if (tpaid < 0 || cpaid < 0) return err('المبالغ المدفوعة لا تكون سالبة');
  if (tpaid + cpaid > goods + 0.004) return err('مجموع ما دفعه التاجر وشركة الشحن أكبر من قيمة البضاعة');
  const pt = document.querySelector('input[name="no-ptype"]:checked')?.value;
  if (!(num('no-metre') > 0)) return err('اكتب سعر المتر المتفق عليه');
  if (!pt) return err('اختر نوع سعر المتر: سعر شامل، أو الشحن البحري فقط والأجور منفصلة');
  const includes = pt === 'incl' ? [...document.querySelectorAll('input[name="no-inc"]:checked')].map(x => x.value) : [];
  if (pt === 'incl' && !includes.length) return err('اختر الأجور التي يشملها سعر المتر، أو اختر «الشحن البحري فقط، والأجور منفصلة»');
  const fees = {};
  if (pt === 'sep') for (const x of document.querySelectorAll('.no-fee')) {
    if (x.value.trim() === '') continue;
    const a = +x.value; if (!isFinite(a) || a < 0) return err('مبالغ الأجور لا تكون سالبة');
    fees[x.dataset.type] = r2(a);
  }
  const other = pt === 'sep' && num('no-other') > 0 ? r2(num('no-other')) : 0, otherNote = pt === 'sep' ? val('no-other-note') : '';
  if (other > 0 && !otherNote) return err('اكتب بيان الأجور الأخرى');
  if (otherNote && !(other > 0)) return err('اكتب مبلغ الأجور الأخرى، أو امسح بيانها');
  if (isNew) { const p = { id: uid('t'), type: 'trader', name: val('nt-name2'), city: val('nt-city2'), phone: val('nt-phone2') }; S.parties.push(p); tid = p.id; }
  const id = uid('o');
  const o = stamp({ id, no: S.seq.order++, traderId: tid, supplierId: val('no-supplier'), date: TODAY, route: document.querySelector('input[name="no-route"]:checked').value,
    goods, metre: num('no-metre'), pricing: pt, includes, fees, other, otherNote,
    advances: cpaid > 0 ? [{ id: uid('ad'), date: TODAY, amount: cpaid, note: 'عند تعريف الطلب' }] : [],
    lines: lines.map((l, i) => ({ id: id + 'l' + i, desc: l.desc, cartons: l.cartons, mode: l.mode, L: l.L, W: l.W, H: l.H, total: l.mode === 'total' ? l.v : undefined, cbm: l.cbm, received: 0 })) });
  S.orders.push(o);
  if (tpaid > 0) S.vouchers.push(stamp({ id: uid('v'), no: S.seq.voucher++, kind: 'receipt', date: TODAY, partyId: tid, amount: tpaid, cur: 'USD', rate: 1, rateType: '', usd: tpaid,
    alloc: [{ k: 'order', id: o.id, amount: tpaid }], note: 'ما دفعه التاجر عند تعريف الطلب', containerId: '' }));
  return `حُفظ الطلب ${o.no}${tpaid > 0 ? '، وسند قبض بما دفعه التاجر' : ''}`;
};

function autoAlloc() {
  let left = readMoney('rc').usd; if (!(left > 0)) return err('اكتب مبلغ السند أولاً');
  const ins = [...document.querySelectorAll('[data-alloc]')];
  const pre = ins.find(i => i.dataset.pre); if (pre) { ins.splice(ins.indexOf(pre), 1); ins.unshift(pre); }
  ins.forEach(i => { const v = Math.min(+i.dataset.max, r2(left)); i.value = v > 0 ? v.toFixed(2) : ''; left = r2(left - Math.max(0, v)); });
  LIVE.receipt('amt');
}

    rd.readAsDataURL(f);
  },
